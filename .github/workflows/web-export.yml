name: Verify web export

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run export:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: dist
          if-no-files-found: error
